name: Install Google-style MH370 workbench

on:
  push:
    branches:
      - agent/google-workbench-y2k
    paths:
      - '.workbench-bootstrap/READY'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore checksum-locked source bundle
        run: |
          cat .workbench-bootstrap/chunk-* > /tmp/workbench-src.b64
          base64 -d /tmp/workbench-src.b64 > /tmp/workbench-src.zip
          echo "3de6b740e03d03118f6b88160aba84ec0d97debef7c163493d30a128b1fe8a4d  /tmp/workbench-src.zip" | sha256sum -c -
          unzip -q /tmp/workbench-src.zip
      - name: Install dependencies
        working-directory: workbench-src
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: workbench-src
        run: npm run lint
      - name: Build static client
        working-directory: workbench-src
        run: npm run build:client
      - name: Archive current public UI
        run: |
          mkdir -p archive/legacy-ui-2026-08-15
          cp index.html archive/legacy-ui-2026-08-15/index.html
          cp app.js archive/legacy-ui-2026-08-15/app.js
          cp styles.css archive/legacy-ui-2026-08-15/styles.css
          cat > archive/legacy-ui-2026-08-15/README.md <<'EOF'
          # Archived pre-workbench public UI
          This directory preserves the public MH370 UI that was at the repository root immediately before the Google-style workbench replacement branch was prepared on 2026-08-15.
          EOF
      - name: Install compiled GitHub Pages root
        run: |
          rm -rf assets
          rm -f index.html app.js styles.css
          cp -R workbench-src/dist/* .
          test -f index.html
          test -d assets
          rm -rf .workbench-bootstrap
      - name: Commit compiled workbench and maintainable source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install Google-style MH370 scientific workbench"
          git push origin HEAD:agent/google-workbench-y2k

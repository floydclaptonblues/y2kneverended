<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Build a structured prompt for mix diagnosis, arrangement, phase, and MIDI work." />
  <title>Mix Prompt Builder — Y2K Never Ended .Net</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="../index.html"><span class="brand-mark">.NET</span><span>Y2K Never Ended</span></a>
    <nav><a href="../index.html#tools">Tools</a><a href="midi-generator.html">MIDI generator</a></nav>
  </header>
  <main id="main" class="shell">
    <section class="page-hero">
      <p class="breadcrumb"><a href="../index.html">Home</a> / Audio</p>
      <p class="eyebrow">Audio tool</p>
      <h1>Mix prompt builder</h1>
      <p>Organize a production problem into a prompt with context, tests, constraints, and the output you need.</p>
    </section>

    <section class="workbench">
      <form id="promptForm">
        <div class="form-grid">
          <div class="field">
            <label for="task">Task</label>
            <select id="task">
              <option>Mix diagnosis</option>
              <option>Phase and masking diagnosis</option>
              <option>Vocal placement</option>
              <option>Arrangement review</option>
              <option>MIDI composition</option>
              <option>MIDI drum programming</option>
              <option>Mastering review</option>
              <option>Sound-design plan</option>
            </select>
          </div>
          <div class="field">
            <label for="daw">DAW or environment</label>
            <input id="daw" placeholder="BandLab, Cakewalk, Logic, Ableton…" />
          </div>
          <div class="field">
            <label for="tempo">Tempo and meter</label>
            <input id="tempo" placeholder="75 BPM, 4/4" />
          </div>
          <div class="field">
            <label for="key">Key or tonal center</label>
            <input id="key" placeholder="E major" />
          </div>
          <div class="field full">
            <label for="problem">What is wrong?</label>
            <textarea id="problem" required placeholder="Describe what you hear and when it happens."></textarea>
          </div>
          <div class="field full">
            <label for="tracks">Relevant tracks or instruments</label>
            <textarea id="tracks" placeholder="Bass, tremolo guitar, lead vocal…"></textarea>
          </div>
          <div class="field">
            <label for="evidence">Measurements or observations</label>
            <textarea id="evidence" placeholder="Phase meter, spectrum, levels, mono test…"></textarea>
          </div>
          <div class="field">
            <label for="tried">What have you tried?</label>
            <textarea id="tried" placeholder="Muted a track, changed EQ, removed an effect…"></textarea>
          </div>
          <div class="field">
            <label for="goal">Desired result</label>
            <textarea id="goal" placeholder="What should change, and what should stay the same?"></textarea>
          </div>
          <div class="field">
            <label for="constraints">Constraints</label>
            <textarea id="constraints" placeholder="No paid plugins, preserve live feel…"></textarea>
          </div>
          <div class="field full">
            <label for="deliverable">Requested output</label>
            <select id="deliverable">
              <option>Ranked diagnostic plan with tests</option>
              <option>Exact DAW action list</option>
              <option>MIDI specification with channels, measures, and note ranges</option>
              <option>Valid downloadable Standard MIDI File</option>
              <option>Mix revision checklist</option>
              <option>Explanation plus uncertainty and missing data</option>
            </select>
          </div>
        </div>
        <div class="action-row">
          <button class="primary" type="submit">Build prompt</button>
          <button type="reset">Clear</button>
        </div>
      </form>

      <div class="output-box">
        <label for="output"><strong>Prompt</strong></label>
        <textarea id="output" readonly></textarea>
        <div class="action-row">
          <button id="copyButton" type="button">Copy</button>
          <button id="downloadButton" type="button">Download .txt</button>
        </div>
        <p class="feedback" id="feedback" aria-live="polite"></p>
      </div>
    </section>
  </main>
  <footer class="site-footer"><div class="shell footer-grid"><div><strong>Mix prompt builder</strong></div><div><a href="../index.html">Back to tools</a></div></div></footer>
  <script src="prompt-builder.js"></script>
</body>
</html>
